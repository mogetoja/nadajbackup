name: NadajBackup
version: 1.0
main: pl.nadajbackup.NadajBackup
api-version: "1.20"
softdepend: [InventoryRollbackPlus]
commands:
  nadajbackup:
    description: Otwiera przywracanie backupu ekwipunku gracza (/ir restore <nick>)
    usage: /nadajbackup <nick>
    permission: nadajbackup.use
permissions:
  nadajbackup.use:
    description: Pozwala uzywac /nadajbackup
    default: op
