name: DeathBackup
main: pl.deathbackup.DeathBackupPlugin
version: ${project.version}
api-version: '1.21'
description: Backup itemow i XP z ostatnich smierci graczy.

commands:
  nadajbackup:
    description: Menu backupow smierci gracza (admin)
    usage: /nadajbackup <gracz>
    permission: deathbackup.admin
  odbierzbackup:
    description: Odbierz backup nadany przez administratora
    usage: /odbierzbackup
    permission: deathbackup.claim
  backup-verify:
    description: Weryfikacja backupow czekajacych na potwierdzenie (administracja)
    usage: /backup-verify
    permission: komendy.backup.verify

permissions:
  deathbackup.admin:
    description: Dostep do /nadajbackup
    default: op
  deathbackup.claim:
    description: Dostep do /odbierzbackup
    default: true
  komendy.backup.verify:
    description: Dostep do /backup-verify - potwierdzanie i odrzucanie backupow
    default: op
  komendy.backup.verify.bypass:
    description: Backupy nadawane przez te osobe nie wymagaja weryfikacji
    default: op
  komendy.backup.alerts:
    description: Widzi na czacie informacje o nadaniach, odbiorach i weryfikacjach backupow
    default: op
